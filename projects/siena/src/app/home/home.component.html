<div style="height: 100%; width: 100%;">
  <!--
  <nid-open-layers-core #mapCore [initialPosition]="initialPosition">
    <ng-container nidOpenLayersWeatherLayer [ngxMapCore]="mapCore" [dataset]="weatherDataset"></ng-container>
  </nid-open-layers-core>
    -->
  <nid-maplibre-core #mapLibreMapCore [initialPosition]="initialPosition" (mapLoad)="mapLoaded = true">
    <ng-container nidMapLibreIsochroneLayer *ngIf="mapLoaded" [ngxMapCore]="mapLibreMapCore"
                  [locations]="locationsForIsochrones" (locationsLoaded)="isochronesLoaded = true"></ng-container>
    <sin-oxxo-coverage *ngIf="isochronesLoaded" [ngxMapCore]="mapLibreMapCore"
                       [proximityByWalkingTimeInSeconds]="240"></sin-oxxo-coverage>
    <ng-container nidMapLibreWeatherLayer *ngIf="mapLoaded" [ngxMapCore]="mapLibreMapCore"
                  [dataset]="weatherDataset"></ng-container>
  </nid-maplibre-core>
  <sin-map-side-panel (click)="test()"></sin-map-side-panel>
</div>
