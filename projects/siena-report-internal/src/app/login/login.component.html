<p-card header="Login">
  <form>
    <div class="p-fluid">
      <div class="p-field">
        <label for="email">Correo Electrónico</label>
        <input id="email" type="text" pInputText [(ngModel)]="email" [ngModelOptions]="{standalone: true}" />
      </div>
      <div class="p-field">
        <label for="password">Contraseña</label>
        <input id="password" type="password" pInputText [(ngModel)]="password" [ngModelOptions]="{standalone: true}" />
      </div>
      <div class="p-field">
        <button pButton type="button" label="Entrar" (click)="submitLogIn()"></button>
      </div>
    </div>
  </form>
</p-card>
